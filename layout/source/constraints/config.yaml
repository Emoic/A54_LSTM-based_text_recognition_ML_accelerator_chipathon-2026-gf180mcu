meta:
  version: 3
  flow: Classic

DESIGN_NAME: lstm16x_top
VERILOG_FILES:
  - dir::../rtl/mul8.v
  - dir::../rtl/act_lut.v
  - dir::../rtl/tanh8.v
  - dir::../rtl/gate_regs.v
  - dir::../rtl/lstm_lane.v
  - dir::../rtl/lstm16x_top.v

CLOCK_PORT: clk
CLOCK_NET: clk
CLOCK_PERIOD: 100

PNR_SDC_FILE: dir::constraints.sdc
SIGNOFF_SDC_FILE: dir::constraints.sdc
FALLBACK_SDC: dir::constraints.sdc

FP_SIZING: absolute
DIE_AREA: [0.0, 0.0, 1000.0, 1000.0]
CORE_AREA: [20.0, 20.0, 980.0, 980.0]
IO_PIN_ORDER_CFG: dir::pin_order.cfg

VDD_NETS:
  - VDD
GND_NETS:
  - VSS

SYNTH_STRATEGY: "AREA 0"
EXTRA_EXCLUDED_CELLS:
  - gf180mcu_fd_sc_mcu7t5v0__nor2_1
  - gf180mcu_fd_sc_mcu7t5v0__nor3_1
PL_TARGET_DENSITY_PCT: 76
MAX_FANOUT_CONSTRAINT: 10
GRT_ALLOW_CONGESTION: true
RUN_POST_GRT_DESIGN_REPAIR: true

DESIGN_REPAIR_MAX_WIRE_LENGTH: 120
DESIGN_REPAIR_MAX_SLEW_PCT: 35
DESIGN_REPAIR_MAX_CAP_PCT: 35
GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH: 0
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 35
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 35

RT_MAX_LAYER: Metal4
DIODE_ON_PORTS: in
PDN_MULTILAYER: false
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75
PDN_EXTEND_TO: boundary

CTS_CLK_MAX_WIRE_LENGTH: 0
CTS_DISTANCE_BETWEEN_BUFFERS: 0
CTS_SINK_CLUSTERING_SIZE: 20
CTS_SINK_CLUSTERING_MAX_DIAMETER: 60

PRIMARY_GDSII_STREAMOUT_TOOL: klayout
ERROR_ON_MAGIC_DRC: true
